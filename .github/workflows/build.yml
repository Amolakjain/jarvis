name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS.apk

      - name: Save APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          body: Phone pe JARVIS.apk download karke install karo.
          files: JARVIS.apk
